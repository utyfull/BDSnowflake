name: bd-snowflake

services:
  postgres:
    image: postgres:16-alpine
    container_name: bd-snowflake-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: snowflake_lab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Europe/Moscow
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d snowflake_lab"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql/data
      - type: bind
        source: ./db
        target: /docker-entrypoint-initdb.d
        read_only: true
      - type: bind
        source: ./исходные данные
        target: /mock_data
        read_only: true

volumes:
  postgres-data:
